appId: com.trackhours.app
productName: Track Hours
copyright: Copyright © ${author}
directories:
  output: release

# Maximum compression for smaller installers (slower build, smaller exe).
compression: maximum

# Asar packaging for the renderer + electron main process.
# Required for EnableEmbeddedAsarIntegrityValidation fuse.
asar: true

# Flip Electron Fuses on the built binary to harden against runtime
# tampering (ELECTRON_RUN_AS_NODE, --inspect, asar integrity bypass).
afterPack: ./scripts/flip-fuses.mjs

# Icon is placed outside the asar so Windows can read it for the taskbar
# and notification area.  The main process references it via
# process.resourcesPath when packaged.
extraResources:
  - from: public/icon.ico
    to: icon.ico

# App source shipped inside the archive.
files:
  - "dist/**/*"
  - "electron/**/*"
  - "public/**/*"
  - "package.json"
  - "!**/*.{md,markdown,map}"
  - "!**/{test,tests,__tests__,docs,doc,examples,example,.bin}/**"
  - "!**/.npmignore"
  - "!**/.eslintrc"
  - "!**/.editorconfig"
  - "!public/gifs/**"

# Remove package.json fields that are only needed at dev time.
removePackageScripts: true
removePackageKeywords: true

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
# artifactName uses a literal "Track-Hours" prefix (not ${productName}, which
# contains a space) so the installer filename has no spaces.  This keeps the
# latest.yml entry in sync with the GitHub release asset name — GitHub
# replaces spaces with dots in asset names, which previously caused a 404
# during auto-update (latest.yml said "Track-Hours-Setup-0.6.x.exe" but the
# uploaded asset was "Track.Hours.Setup.0.6.x.exe").
win:
  target: nsis
  icon: public/icon.ico
  artifactName: Track-Hours-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  differentialPackage: true

# ---------------------------------------------------------------------------
# Linux
# ---------------------------------------------------------------------------
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  category: Office
  icon: public/icon.png
  artifactName: Track-Hours-${version}-${arch}.${ext}
  desktop:
    entry:
      MimeType: "x-scheme-handler/trackhours"
      Keywords: "time;tracking;timer;productivity;"

# ---------------------------------------------------------------------------
# Publishing
# ---------------------------------------------------------------------------
publish:
  provider: github
  owner: realdeepnull
  repo: track-hours